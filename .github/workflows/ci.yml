name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Shared MySQL schema, built fresh every run from the pinned Self-bot
  # submodule ledger, then layered with the Dashboard's own ledger
  # (dashboard_sse_cursor as of Step 03) - 05_THIRD_REPOSITORY_ARCHITECTURE.md §Build & CI.
  MYSQL_DATABASE: bunny_command_center
  MYSQL_ROOT_PASSWORD: ci_root_pass
  DASHBOARD_APP_DB_USER: bunny_dashboard_app
  DASHBOARD_APP_DB_PASSWORD: ci_app_pass
  DASHBOARD_MIGRATOR_DB_USER: bunny_dashboard_migrator
  DASHBOARD_MIGRATOR_DB_PASSWORD: ci_migrator_pass

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0.39
        env:
          MYSQL_ROOT_PASSWORD: ${{ env.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: ${{ env.MYSQL_DATABASE }}
        ports:
          - 3306:3306
        # `options` doesn't support the `env` context (unlike `services.<id>.env`
        # above), so this throwaway CI-only password is hardcoded rather than
        # referencing the workflow-level env: block.
        options: >-
          --health-cmd="mysqladmin ping -uroot -pci_root_pass"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout (with pinned Self-bot schema submodule)
        uses: actions/checkout@v4
        with:
          submodules: true
          # 02-SELF-BOT is a private repo - the default per-run GITHUB_TOKEN
          # is scoped only to this repository and can't fetch a different
          # private repo as a submodule, even under the same owner. A repo
          # secret with read access to 02-SELF-BOT is required.
          token: ${{ secrets.SELF_BOT_REPO_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Setup Python (for the real Self-bot migrator - no self-bot code touched)
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Self-bot migrator's runtime dependencies
        # Matches 01_NEW_SELF_BOTS/requirements.txt's own pins for these two
        # packages exactly (aiomysql itself, plus cryptography - required by
        # PyMySQL/aiomysql for MySQL 8's default caching_sha2_password auth
        # plugin; the first real run without it failed with "'cryptography'
        # package is required for sha256_password or caching_sha2_password
        # auth methods").
        run: pip install "aiomysql>=0.1.1" "cryptography>=3.0.0"

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: i18n completeness check
        run: npm run i18n:lint

      - name: Design-system contrast check (WCAG 2.2 AA, all 9 theme x mode combinations)
        run: npm run contrast:check

      - name: "Create Dashboard DB accounts (app: no DDL, migrator: DDL)"
        run: |
          mysql -h127.0.0.1 -P3306 -uroot -p"${MYSQL_ROOT_PASSWORD}" <<SQL
          CREATE USER IF NOT EXISTS '${DASHBOARD_APP_DB_USER}'@'%' IDENTIFIED BY '${DASHBOARD_APP_DB_PASSWORD}';
          GRANT SELECT, INSERT, UPDATE, DELETE ON ${MYSQL_DATABASE}.* TO '${DASHBOARD_APP_DB_USER}'@'%';
          CREATE USER IF NOT EXISTS '${DASHBOARD_MIGRATOR_DB_USER}'@'%' IDENTIFIED BY '${DASHBOARD_MIGRATOR_DB_PASSWORD}';
          GRANT ALL PRIVILEGES ON *.* TO '${DASHBOARD_MIGRATOR_DB_USER}'@'%';
          FLUSH PRIVILEGES;
          SQL

      - name: Apply the REAL Self-bot canonical migration ledger (shared schema)
        working-directory: vendor/self-bot-schema
        env:
          MIGRATOR_DB_HOST: 127.0.0.1
          MIGRATOR_DB_PORT: "3306"
          MIGRATOR_DB_USER: ${{ env.DASHBOARD_MIGRATOR_DB_USER }}
          MIGRATOR_DB_PASSWORD: ${{ env.DASHBOARD_MIGRATOR_DB_PASSWORD }}
          MIGRATOR_DB_NAME: ${{ env.MYSQL_DATABASE }}
        run: python database/migrate.py up

      - name: Apply the Dashboard's own migration ledger (dashboard_users/dashboard_sessions/dashboard_sse_cursor)
        working-directory: apps/api
        env:
          MIGRATOR_DB_HOST: 127.0.0.1
          MIGRATOR_DB_PORT: "3306"
          MIGRATOR_DB_USER: ${{ env.DASHBOARD_MIGRATOR_DB_USER }}
          MIGRATOR_DB_PASSWORD: ${{ env.DASHBOARD_MIGRATOR_DB_PASSWORD }}
          MIGRATOR_DB_NAME: ${{ env.MYSQL_DATABASE }}
          RUNNER_ENV: LOCAL_DISPOSABLE
        run: npm run migrate -- up

      - name: kysely-codegen freshness check
        working-directory: apps/api
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_USER: ${{ env.DASHBOARD_APP_DB_USER }}
          DB_PASSWORD: ${{ env.DASHBOARD_APP_DB_PASSWORD }}
          DB_NAME: ${{ env.MYSQL_DATABASE }}
        run: npm run codegen:check

      - name: Unit + real-MySQL integration tests (apps/api - migration runner, health/readyz, additive audit, SSE cursor/poller/hub/stream)
        working-directory: apps/api
        env:
          TEST_MYSQL_HOST: 127.0.0.1
          TEST_MYSQL_PORT: "3306"
          TEST_MYSQL_ROOT_PASSWORD: ${{ env.MYSQL_ROOT_PASSWORD }}
        run: npx vitest run

      - name: Unit tests (packages/shared - i18n gates incl. D-050, Intl formatting contracts)
        working-directory: packages/shared
        run: npx vitest run

      - name: Unit tests (apps/web - theme engine, design system, i18n)
        working-directory: apps/web
        run: npx vitest run

      - name: Install Playwright's Chromium (for the real-browser e2e/a11y suite below)
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: "E2E: theme x mode matrix, i18n runtime, responsive, axe-core accessibility, realtime SSE (real apps/api E2E server)"
        working-directory: apps/web
        env:
          # apps/web/playwright.config.ts's webServer chain
          # (e2e-db-setup -> e2e-server) and apps/web/e2e/realtime.spec.ts's
          # own direct DB pool both read these to reach the SAME MySQL
          # service this job already has running - a dedicated, disposable
          # `bunny_cc_e2e` database, distinct from the `bunny_command_center`
          # database used by every other step above.
          TEST_MYSQL_HOST: 127.0.0.1
          TEST_MYSQL_PORT: "3306"
          TEST_MYSQL_ROOT_PASSWORD: ${{ env.MYSQL_ROOT_PASSWORD }}
        run: npx playwright test

      - name: Upload Playwright failure artifacts (screenshots, traces, accessibility snapshots)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: apps/web/test-results/
          retention-days: 7

      - name: Build (api + web + shared)
        run: npm run build

      - name: apps/web production build sanity check
        run: test -f apps/web/dist/index.html

      - name: "Reset Dashboard DB account passwords (Playwright's e2e-db-setup.ts mutates the shared MySQL accounts as a side effect)"
        # apps/web/playwright.config.ts's webServer chain runs
        # apps/api/scripts/e2e-db-setup.ts before every Playwright run, which
        # does `ALTER USER 'bunny_dashboard_app'@'%' IDENTIFIED BY 'app_pass'`
        # (and the same for the migrator account) against this job's SAME
        # long-lived MySQL service container/global user - MySQL accounts are
        # global, not scoped to the `bunny_cc_e2e` database that script
        # otherwise confines itself to, and `ALTER USER` unconditionally
        # overwrites the password (unlike the earlier `CREATE USER IF NOT
        # EXISTS` step, which is a no-op on an existing user). Every step
        # BEFORE the Playwright E2E step in this job used the original
        # `ci_app_pass`/`ci_migrator_pass` values and passed; nothing ran
        # after Playwright and relied on that account again until this
        # correction added one - so the compiled-runtime smoke test below is
        # the first thing to actually observe the stale password. Re-asserts
        # the CI-declared passwords immediately before they're needed again,
        # rather than depending on Playwright's own internal, unrelated
        # password constant staying whatever it happens to be.
        run: |
          mysql -h127.0.0.1 -P3306 -uroot -p"${MYSQL_ROOT_PASSWORD}" <<SQL
          ALTER USER '${DASHBOARD_APP_DB_USER}'@'%' IDENTIFIED BY '${DASHBOARD_APP_DB_PASSWORD}';
          ALTER USER '${DASHBOARD_MIGRATOR_DB_USER}'@'%' IDENTIFIED BY '${DASHBOARD_MIGRATOR_DB_PASSWORD}';
          FLUSH PRIVILEGES;
          SQL

      - name: "Compiled-production-runtime smoke test (Step 04 correction 2): plain 'node dist/server.js' must actually boot"
        # Deliberately NOT just "does dist/server.js exist" - this actually
        # launches the COMPILED artifact (via apps/api's real "start"
        # script command) under plain Node, no tsx anywhere in the loop, and
        # proves build -> launch -> real /healthz -> real /readyz (real
        # MySQL, the SAME already-migrated `bunny_command_center` database
        # the earlier steps in this job used) -> real /api/version -> real
        # /api/auth/login redirect -> SIGTERM -> clean exit. Catches the
        # exact class of defect this correction was opened for: a compiled
        # server that `tsc` happily emits but that ERR_MODULE_NOT_FOUNDs the
        # instant a real, plain-Node process tries to run it.
        working-directory: apps/api
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_USER: ${{ env.DASHBOARD_APP_DB_USER }}
          DB_PASSWORD: ${{ env.DASHBOARD_APP_DB_PASSWORD }}
          DB_NAME: ${{ env.MYSQL_DATABASE }}
          # Deliberately fake, non-secret, CI-only placeholder values (same
          # convention as this workflow's own ci_root_pass/ci_app_pass) -
          # this gate proves the compiled server BOOTS and SERVES, not that
          # real Discord OAuth works (that is explicitly out of scope here,
          # see Step 04's HANDOVER).
          DISCORD_CLIENT_ID: ci-smoke-test-client-id
          DISCORD_CLIENT_SECRET: ci-smoke-test-client-secret
          DISCORD_REDIRECT_URI: http://127.0.0.1:8199/api/auth/callback
          DASHBOARD_OAUTH_TRANSACTION_SIGNING_KEY: "1111111111111111111111111111111111111111111111111111111111111111"
          DASHBOARD_TOKEN_ENCRYPTION_KEY: "2222222222222222222222222222222222222222222222222222222222222222"
          # Step 05 (ADR-008): required for loadAppConfig() to succeed —
          # deliberately-fake, non-secret, CI-only placeholder Snowflake
          # (never the real production Superadmin ID, which lives only in a
          # real deployment's env).
          PLATFORM_SUPERADMIN_DISCORD_ID: "900000000000000001"
        run: npm run smoke-test-compiled
