         BEFORE the module script below, or it stops being blocking and the flash returns.
         The `lang` attribute above is the pre-i18n default; BccI18nProvider replaces it with
         the resolved locale on mount. -->
    <!--BCC_PRELOAD_THEME-->
  </head>
